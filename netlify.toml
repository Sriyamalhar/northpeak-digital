# NorthPeak Digital — Netlify configuration
# This file means Netlify needs zero manual settings. It publishes the
# repo root as-is (no build step, since the site is plain HTML/CSS/JS)
# and adds a few sensible security + caching headers.

[build]
  publish = "."

# Security + caching headers applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
